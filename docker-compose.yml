version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reducebunker_app
    volumes:
      - .:/var/www
    networks:
      - traefik-net

  nginx:
    image: nginx:latest
    container_name: reducebunker_nginx
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    networks:
      - traefik-net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      - "traefik.http.routers.bunkerai.rule=Host(`pe.spil.co.id`) && PathPrefix(`/bunkerai`)"
      - "traefik.http.routers.bunkerai.entrypoints=websecure"
      - "traefik.http.routers.bunkerai.tls=true"

      - "traefik.http.routers.bunkerai.middlewares=strip-bunkerai"
      - "traefik.http.middlewares.strip-bunkerai.stripprefix.prefixes=/bunkerai"

      - "traefik.http.services.bunkerai.loadbalancer.server.port=5000"

networks:
  traefik-net:
    external: true